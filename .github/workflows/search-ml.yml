name: Busca automática no Mercado Livre

on:
  # AGENDAMENTO PAUSADO (20/10/2026): o secret CRON_SECRET ainda não foi
  # criado no GitHub e o Mercado Livre ainda não liberou a busca para a
  # aplicação (403), então cada execução só falhava e mandava e-mail.
  # Para religar: crie o secret CRON_SECRET (mesmo valor do Vercel) e
  # descomente as 5 linhas abaixo. Enquanto isso, dá para rodar manualmente
  # pela aba Actions > "Run workflow".
  #
  # schedule:
  #   # Roda 6x por dia (a cada 4h, em UTC). O Vercel Hobby só permite cron
  #   # 1x/dia, por isso usamos o GitHub Actions (gratuito) para chamar a
  #   # rota protegida com mais frequência.
  #   - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de busca
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Se o secret não existir no repositório, ele chega aqui vazio.
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::O secret CRON_SECRET não está configurado neste repositório (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          code=$(curl -sS -o resp.txt -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://curadoria-ml.vercel.app/api/cron/search-ml")
          echo "HTTP $code"
          cat resp.txt

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::A rota respondeu HTTP $code: $(head -c 300 resp.txt)"
            exit 1
          fi
